<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrenamiento · Planificador</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2e9d8;--card:#fbf6ea;--ink:#1d1b1a;--tq:#1c9a98;--vi:#6b4aa0;--tan:#c8a679;--mut:#7a6d5a;--ln:#dccdb0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1714;--card:#25211c;--ink:#f1e8d8;--tq:#3cc4c0;--vi:#a98bdc;--tan:#8c7452;--mut:#b3a58d;--ln:#3a342b}}
:root[data-theme="dark"]{--bg:#1a1714;--card:#25211c;--ink:#f1e8d8;--tq:#3cc4c0;--vi:#a98bdc;--tan:#8c7452;--mut:#b3a58d;--ln:#3a342b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Nunito,system-ui,sans-serif;background-image:radial-gradient(circle at 8% 5%,#1c9a9822,transparent 40%),radial-gradient(circle at 95% 20%,#6b4aa01f,transparent 38%)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0}
header.top{padding:22px 20px 8px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
header.top h1{font-size:28px}header.top span{color:var(--mut);font-style:italic}
nav{display:flex;gap:8px;padding:8px 20px;overflow-x:auto}
nav button{border:1.5px solid var(--ln);background:var(--card);color:var(--ink);padding:9px 18px;border-radius:30px 14px 30px 14px;font:600 14px Nunito;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--vi);color:#fff;border-color:var(--vi)}
main{padding:10px 20px 40px;max-width:1100px;margin:auto}
.card{background:var(--card);border:1.5px solid var(--ln);border-radius:28px 12px 30px 14px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}@media(max-width:800px){.grid2{grid-template-columns:1fr}}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--ln);border-radius:14px;padding:8px 12px;min-width:0}
.btn{border:0;background:var(--tq);color:#fff;padding:9px 16px;border-radius:30px;font:700 14px Nunito;cursor:pointer}
.btn.vi{background:var(--vi)}.btn.bk{background:#1d1b1a;color:#f2e9d8}.btn.gh{background:transparent;color:var(--ink);border:1.5px solid var(--ln)}
.sm{border:1.5px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:10px;padding:2px 8px;cursor:pointer;font-size:13px}
.blk{margin:12px 0;padding:12px;border:1.5px dashed var(--ln);border-radius:22px 10px 24px 12px}
.blk.on{border:1.5px solid var(--tq);background:#1c9a9810}
.blk header{display:flex;gap:8px;margin-bottom:6px}.blk header input{flex:1;font-weight:700;font-family:Fraunces,serif}
.it,.pk{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;margin:4px 0;background:var(--card);border-radius:14px;border:1px solid var(--ln)}
.it .a{display:flex;gap:4px;flex-shrink:0}
.dt{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid #0004;margin-right:3px;vertical-align:-1px}
.sp{font-size:12px;color:var(--mut)}
.tag{font-size:11px;padding:1px 9px;border-radius:20px;background:var(--tan);color:#1d1b1a;margin-left:6px}
.tag.Principiante{background:#9fdad6;color:#0d3b3a}.tag.Intermedio{background:#cdbbec;color:#2c1a50}.tag.Avanzado{background:#1d1b1a;color:#f2e9d8}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1.5px solid var(--ln);background:var(--card);color:var(--ink);border-radius:20px;padding:4px 14px;cursor:pointer;font:600 13px Nunito}
.chip.on{background:var(--tq);color:#fff;border-color:var(--tq)}
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.ec{background:var(--card);border:1.5px solid var(--ln);border-radius:26px 10px 26px 12px;overflow:hidden}
.ec .im{height:110px;width:100%;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:42px;background:linear-gradient(135deg,#1c9a9833,#6b4aa033,#c8a67944)}
.ec .bd{padding:10px 12px}.ec h3{font-size:16px}
.grp{margin:16px 0 6px;color:var(--vi);font:600 18px Fraunces,serif}
.empty{color:var(--mut);font-style:italic;padding:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d1b1a;color:#f2e9d8;padding:10px 20px;border-radius:30px;display:none;z-index:9}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block;color:#000;background:#fff;padding:10px;font-family:Georgia,serif}#print h1{color:#1c9a98}#print .pb{margin:14px 0}#print li{margin:4px 0}#print img{width:38px;height:38px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-right:8px}}
.mo{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:8}.mo[hidden]{display:none}#mdl{max-width:640px;width:100%;max-height:90vh;overflow:auto}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--ln);border-radius:14px;padding:8px 12px;min-height:70px}
.th{width:44px;height:44px;object-fit:cover;border-radius:12px}.dz{border:2px dashed var(--tan);border-radius:18px;padding:14px;text-align:center;color:var(--mut);cursor:pointer;margin:10px 0 6px}.pg{justify-content:center;margin-top:14px}
.paper{background:var(--bg);border:1.5px solid var(--ln);border-radius:20px;padding:14px;max-height:55vh;overflow:auto}.gl{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}@media(max-width:800px){.gl{grid-template-columns:1fr}}.gside{background:var(--bg);border:1.5px solid var(--ln);border-radius:20px;padding:12px;font-size:13px;align-self:start}.gside label{font-size:12px;color:var(--mut)}.pr{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dotted var(--ln)}.bar{height:10px;border-radius:6px;background:var(--ln);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%}img.th,img.im{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:zoom-in}.cw{display:flex;flex-wrap:wrap;gap:10px}.cc{flex:1 1 190px;max-width:270px;background:var(--card);border:1px solid var(--ln);border-radius:20px 8px 20px 10px;padding:10px;display:flex;flex-direction:column;gap:4px}.cc .a{display:flex;gap:4px;margin-top:auto;padding-top:6px}.th.big{width:100%;height:90px}
:root{--bg:#f5f6f7;--card:#fff;--ink:#202124;--tq:#c62828;--vi:#c62828;--tan:#d7dbe0;--mut:#687078;--ln:#e1e4e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#f5f6f7;--card:#fff;--ink:#202124;--tq:#c62828;--vi:#c62828;--tan:#d7dbe0;--mut:#687078;--ln:#e1e4e8}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Inter,Arial,sans-serif;background-image:none}
h1,h2,h3{font-family:Inter,Arial,sans-serif;font-weight:650;letter-spacing:-.02em}
header.top h1{font-size:26px;letter-spacing:-.04em}header.top span{font-style:normal;color:var(--mut)}
nav button{border:1px solid var(--ln);background:#fff;color:var(--ink);border-radius:8px;font:600 13px Inter,Arial,sans-serif}
nav button.on{background:#c62828;color:#fff;border-color:#c62828}
.card{background:#fff;border:1px solid var(--ln);border-radius:12px;box-shadow:0 2px 10px #1111}
input,select,textarea{background:#fff;border:1px solid #d7dbe0;border-radius:7px}
.btn{background:#c62828;border-radius:7px;font:600 13px Inter,Arial,sans-serif}
.btn.vi{background:#555b62}.btn.bk{background:#202124;color:#fff}.btn.gh{background:#fff;color:#444;border:1px solid #d7dbe0}
.sm{border:1px solid #d7dbe0;background:#fff;border-radius:6px}
.blk{border:1px solid #e1e4e8;border-radius:9px;background:#fafafa}.blk.on{border-color:#c62828;background:#c6282808}
.blk header input{font-family:Inter,Arial,sans-serif}
.it,.pk{background:#fff;border:1px solid #e6e8eb;border-radius:8px}
.tag{background:#e9ecef;color:#4b5158;border-radius:5px}.tag.Principiante,.tag.Intermedio,.tag.Avanzado{background:#eef0f2;color:#444}
.chip{border:1px solid #dfe2e6;background:#fff;border-radius:7px;font:600 12px Inter,Arial,sans-serif}.chip.on{background:#c62828;color:#fff;border-color:#c62828}
.ec{border:1px solid #e1e4e8;border-radius:10px;background:#fff}.ec .im{background:#f0f1f3}
.grp{color:#c62828;font:650 16px Inter,Arial,sans-serif}.paper{background:#fff;border:1px solid #ddd;border-radius:8px}.gside{background:#fff}
#toast{background:#24272b;border-radius:8px}.cc{background:#fff;border:1px solid #e1e4e8;border-radius:9px}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></head><body>
<header class="top"><h1>Entrenamiento</h1><span>planificá tus planillas</span></header>
<nav id="nav"></nav>
<main>
<section id="t-b"><div class="card" style="max-width:780px;margin:auto"><h2>Armar planilla</h2>
 <div class="row" style="margin:10px 0"><input id="cn" placeholder="Nombre de la clase" oninput="cur.name=this.value" style="flex:1 1 180px">
  <input type="date" id="cd" onchange="cur.date=this.value"><select id="ct" onchange="cur.turno=this.value"><option>Mañana</option><option>Tarde</option><option>Noche</option></select><input type="time" id="ch" onchange="cur.hora=this.value"><select id="studentSel" onchange="cur.studentId=this.value"><option value="">Sin alumno asignado</option></select><select id="tp" onchange="cur.tpl=this.value;rB()"><option value="clasica">Plantilla: Clásica</option><option value="circuitos">Plantilla: Circuitos</option></select></div>
 <div id="blks"></div>
 <div class="row" style="margin-top:12px"><button class="btn gh" onclick="addB()">＋ Bloque</button><button class="btn" onclick="saveC()">Guardar</button><button class="btn vi" onclick="pdf(cur)">Descargar PDF</button><button class="btn gh" onclick="newClass()">Nueva</button></div></div></section>
<section id="t-l" hidden><div class="card"><div class="row" style="justify-content:space-between"><h2>Biblioteca de clases</h2><button class="btn" onclick="studentModal()">＋ Crear alumno</button></div>
 <div class="row" style="margin-top:10px"><span class="sp">Agrupar por</span><select id="gb" onchange="rL(1)"><option value="student">Alumno</option><option value="turno">Turno</option><option value="hora">Horario</option><option value="mes">Mes</option><option value="all">Sin agrupar</option></select><select id="studentFilter" onchange="rL(1)"><option value="">Todos los alumnos</option></select><input id="ls" placeholder="Buscar planilla…" oninput="rL(1)"></div><div id="ll"></div><div class="row pg" id="pg"></div></div></section>
<section id="t-e" hidden><div class="card"><div class="row"><h2 style="flex:1">Biblioteca de ejercicios</h2><select id="fl" onchange="rE()"></select></div><div class="chips" id="fa"></div></div>
 <div class="eg" id="eg" style="margin-top:14px"></div></section>
<section id="t-c" hidden><div class="card" style="max-width:640px;margin:auto"><h2>Crear ejercicio</h2>
 <div class="row" style="margin:12px 0"><input id="xn" placeholder="Nombre" style="flex:1 1 180px"><select id="xa" onchange="spv()"></select><select id="xl"><option>Principiante</option><option>Intermedio</option><option>Avanzado</option></select></div>
 <textarea id="xd" placeholder="Descripción: posición, ejecución, respiración…"></textarea>
 <div class="row spx" id="xs" style="margin-top:8px"></div>
 <div id="dzc"></div><button class="btn" onclick="addEx()">Crear ejercicio</button></div></section>
<div id="modal" class="mo" hidden><div class="card" id="mdl"></div></div>
</main>
<div id="print"></div><div id="toast"></div>
<script>
const AP=['Fuerza','Velocidad','Resistencia','Equilibrio','Flexibilidad','Movilidad'],
EM={Fuerza:'●',Velocidad:'↗',Resistencia:'◒',Equilibrio:'◇',Flexibilidad:'⌁',Movilidad:'↔'},
SP={Fuerza:['#c62828',1],Velocidad:['#8f1d1d',1],Resistencia:['#666b72',1],Equilibrio:['#9b3030',1],Flexibilidad:['#92979e',1],Movilidad:['#4f555c',1]},
SPAP=[],LV={P:'Principiante',I:'Intermedio',A:'Avanzado'};
const SEED=`Sentadilla a silla|Fuerza|P
Remo con banda|Fuerza|P
Elevación de talones|Fuerza|P
Marcha rápida en el lugar|Velocidad|P
Desplazamientos cortos|Velocidad|I
Caminata continua|Resistencia|P
Circuito aeróbico suave|Resistencia|P
Apoyo unipodal asistido|Equilibrio|P
Transferencias de peso|Equilibrio|P
Estiramiento de cadena posterior|Flexibilidad|P
Movilidad de columna|Movilidad|P
Círculos de hombros|Movilidad|P`.split('\n').map((r,i)=>{const[n,ap,l]=r.split('|');return{id:'s'+i,n,ap,lv:LV[l],sp:[],d:''}});
let S={ex:[],cl:[],students:[]};try{S=Object.assign(S,JSON.parse(localStorage.getItem('entrenamiento1')||'{}'))}catch(e){} S.students=S.students||[];
const sv=()=>{try{localStorage.setItem('entrenamiento1',JSON.stringify(S))}catch(e){toast('Sin espacio: usá imágenes más chicas')}};
const ALL=()=>SEED.filter(e=>!(S.hid||[]).includes(e.id)).map(e=>({...e,...(S.ov||{})[e.id]})).concat(S.ex),$=i=>document.getElementById(i),G=id=>ALL().find(e=>e.id==id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)};
const dots=sp=>sp.length?`<span class="sp">${sp.map(s=>`<span class="tag" style="background:${SP[s]?.[0]||'#777'};color:#fff">${esc(s)}</span>`).join(' ')}</span>`:'';
const newC=()=>({tpl:'clasica',id:null,name:'',studentId:'',date:new Date().toISOString().slice(0,10),turno:'Mañana',hora:'09:00',blocks:[{n:'Calentamiento',it:[]},{n:'Trabajo principal',it:[]},{n:'Cierre',it:[]}]});
let cur=newC(),act=0,fa='Todos',tmpImg='';
// tabs
const TABS=[['b','Armar planilla'],['l','Biblioteca de clases'],['e','Ejercicios'],['c','Crear ejercicio']];
function go(t){TABS.forEach(([k])=>{if($('t-'+k))$('t-'+k).hidden=k!=t});$('nav').innerHTML=TABS.map(([k,l])=>`<button class="${k==t?'on':''}" onclick="go('${k}')">${l}</button>`).join('');if(t=='b')rB();if(t=='l')rL(1);if(t=='e')rE();if(t=='c')dz('dzc')}
const nz=c=>{c.tpl=c.tpl||'clasica';c.studentId=c.studentId||'';c.blocks.forEach(b=>b.it=b.it.map(x=>typeof x=='string'?{id:x}:x));return c};S.cl.forEach(nz);S.ov=S.ov||{};S.hid=S.hid||[];
const M=h=>{$('mdl').innerHTML=h;$('modal').hidden=false},cm=()=>{$('modal').hidden=true;$('mdl').innerHTML='';$('mdl').style.maxWidth=''};
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const spx=(sel)=>Object.keys(SP).map(s=>`<label class="chip"><input type="checkbox" value="${s}" ${sel.includes(s)?'checked':''}> <i class="dt" style="background:${SP[s][0]}"></i>${s}</label>`).join('');
const rd=()=>[...($('modal').hidden?document:$('mdl')).querySelectorAll('.spx input:checked')].map(i=>i.value);
const load=sp=>sp.reduce((a,s)=>a+SP[s][1],0);
// image helpers (compressed to 240px)
function comp(f,cb){if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=360/Math.max(i.width,i.height,360),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))};i.src=r.result};r.readAsDataURL(f)}
const dz=(id,img)=>{$(id).innerHTML=`<div class="dz" ondragover="event.preventDefault()" ondrop="event.preventDefault();pick(event.dataTransfer.files[0],'${id}')" onclick="$('fi_${id}').click()">Arrastrá una imagen acá o tocá para elegir un archivo<br><span class="sp">se comprime automáticamente</span></div><input type="file" id="fi_${id}" hidden accept="image/*" onchange="pick(this.files[0],'${id}')"><div id="pv_${id}">${img?`<img class="th" src="${img}">`:''}</div>`};
const pick=(f,id)=>comp(f,u=>{tmpImg=u;$('pv_'+id).innerHTML=`<img class="th" src="${u}">`;toast('Imagen lista')});
// builder
function rB(){$('cn').value=cur.name;$('cd').value=cur.date;$('ct').value=cur.turno;$('ch').value=cur.hora;fillStudentSelect();$('studentSel').value=cur.studentId||'';$('tp').value=cur.tpl;
 const cc=cur.tpl=='circuitos';$('t-b').firstElementChild.style.maxWidth=cc?'1100px':'780px';
 $('blks').innerHTML=cur.blocks.map((b,bi)=>{const its=b.it.map((t,ii)=>{const e=G(t.id)||{n:'(eliminado)',sp:[]},d=t.d??e.d??'',sp=t.sp??e.sp,im=t.img&&e.img?`<img class="th${cc?' big':''}" src="${e.img}">`:'',nm=`<b>${ii+1}. ${esc(t.n||e.n)}</b>`,ds=d?`<span class="sp">${esc(d)}</span>`:'';
  const bt=`<span class="a"><button class="sm" onclick="mv(${bi},${ii},-1)">${cc?'◀':'↑'}</button><button class="sm" onclick="mv(${bi},${ii},1)">${cc?'▶':'↓'}</button><button class="sm" title="Editar" onclick="ei(${bi},${ii})">✎</button><button class="sm" onclick="cur.blocks[${bi}].it.splice(${ii},1);rB()">✕</button></span>`;
  return cc?`<div class="cc">${im}${nm}<div>${dots(sp)}</div>${ds}${bt}</div>`:`<div class="it"><span style="display:flex;gap:8px;align-items:center">${im}<span>${nm} ${dots(sp)}${d?'<br>'+ds:''}</span></span>${bt}</div>`}).join('');
  return`<div class="blk"><header><input value="${esc(b.n)}" onchange="cur.blocks[${bi}].n=this.value"><button class="sm" onclick="delB(${bi})" title="Quitar bloque">✕</button></header>${cc?`<div class="cw">${its}</div>`:its}<button class="btn gh" style="padding:5px 14px;margin-top:6px" onclick="openPick(${bi})">＋ Ejercicio</button></div>`}).join('')}
const addB=()=>{cur.blocks.push({n:'Nuevo bloque',it:[]});rB()};
const ask=(m,fn)=>{window._cf=fn;M(`<p>${m}</p><div class="row"><button class="btn bk" onclick="cm();_cf()">Sí, eliminar</button><button class="btn gh" onclick="cm()">Cancelar</button></div>`)};
const delB=i=>{const f=()=>{cur.blocks.splice(i,1);rB()};cur.blocks[i].it.length?ask('El bloque tiene ejercicios. ¿Quitarlo?',f):f()};
function mv(b,i,d){const a=cur.blocks[b].it,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];rB()}
let pb=0,eb=0,ek=0;
function openPick(bi){pb=bi;M(`<h2>Agregar a «${esc(cur.blocks[bi].n)}»</h2><div class="row" style="margin:10px 0"><input id="ps" placeholder="Buscar…" oninput="rP()" style="flex:1"><select id="pa" onchange="rP()">${['Todos',...AP].map(a=>`<option>${a}</option>`).join('')}</select></div><button class="btn vi" style="margin-bottom:8px" onclick="openNew()">＋ Crear ejercicio nuevo</button><div id="pl" style="max-height:44vh;overflow:auto"></div><button class="btn" style="margin-top:10px" onclick="cm()">Listo</button>`);rP()}
function openNew(){tmpImg='';M(`<h2>Nuevo ejercicio para «${esc(cur.blocks[pb].n)}»</h2><div class="row" style="margin:10px 0"><input id="qn" placeholder="Nombre" style="flex:1 1 160px"><select id="qa">${AP.map(a=>`<option>${a}</option>`).join('')}</select><select id="ql"><option>Principiante</option><option>Intermedio</option><option>Avanzado</option></select></div><textarea id="qd" placeholder="Descripción"></textarea><div id="dzq"></div><div class="row" style="margin-top:10px"><button class="btn" onclick="addQ()">Crear y agregar</button><button class="btn gh" onclick="openPick(pb)">Volver</button></div>`);dz('dzq')}
const qsp=()=>$('qs').innerHTML='';
